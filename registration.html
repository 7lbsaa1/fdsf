<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky7 - إنشاء حساب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-400 via-sky-500 to-purple-600">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 right-20 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-40 left-10 w-96 h-96 bg-purple-400/20 rounded-full blur-3xl"></div>
    </div>

    <div class="relative min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-3 mb-4">
                    <img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="Sky7" class="w-16 h-16 drop-shadow-lg">
                    <h1 class="text-5xl font-bold text-white drop-shadow-lg">Sky7</h1>
                </div>
                <p class="text-sky-100 text-lg">أنشئ حسابك وشارك صور السماء</p>
            </div>

            <div class="bg-white/95 backdrop-blur-lg rounded-3xl shadow-2xl p-8">
                <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">إنشاء حساب جديد</h2>
                
                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">اسم المستخدم</label>
                        <input type="text" id="username" required minlength="3" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-sky-500 focus:border-transparent outline-none transition-all" placeholder="اسم المستخدم">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">البريد الإلكتروني</label>
                        <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-sky-500 focus:border-transparent outline-none transition-all" placeholder="example@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور</label>
                        <input type="password" id="password" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-sky-500 focus:border-transparent outline-none transition-all" placeholder="6 أحرف على الأقل">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">تأكيد كلمة المرور</label>
                        <input type="password" id="confirmPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-sky-500 focus:border-transparent outline-none transition-all" placeholder="أعد إدخال كلمة المرور">
                    </div>
                    <div id="errorMsg" class="hidden text-red-500 text-sm text-center"></div>
                    <button type="submit" id="registerBtn" class="w-full py-3 bg-gradient-to-r from-sky-500 to-purple-500 text-white font-semibold rounded-xl hover:from-sky-600 hover:to-purple-600 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">إنشاء الحساب</button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-gray-600">لديك حساب بالفعل؟</p>
                    <a href="index.html" class="text-sky-600 hover:text-sky-700 font-semibold hover:underline">تسجيل الدخول</a>
                </div>
            </div>

            <div class="text-center mt-6 text-white/70 text-sm">
                <p>© 2024 Sky7 - عالم صور السماء</p>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDFwusZ60ZdCwNfg__YrMA6Ww25jeBOiDk",
            authDomain: "vid1-e2c7d.firebaseapp.com",
            databaseURL: "https://vid1-e2c7d-default-rtdb.firebaseio.com",
            projectId: "vid1-e2c7d",
            storageBucket: "vid1-e2c7d.firebasestorage.app",
            messagingSenderId: "323883326794",
            appId: "1:323883326794:web:e1254b899aefa6584175b3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const registerBtn = document.getElementById('registerBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');

            errorMsg.classList.add('hidden');

            if (password !== confirmPassword) {
                errorMsg.textContent = 'كلمات المرور غير متطابقة';
                errorMsg.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                errorMsg.classList.remove('hidden');
                return;
            }

            loadingOverlay.classList.remove('hidden');
            registerBtn.disabled = true;

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const userId = userCredential.user.uid;

                await database.ref('users/' + userId).set({
                    username: username,
                    email: email,
                    avatar: '',
                    coverImage: '',
                    bio: '',
                    isVerified: false,
                    isBlocked: false,
                    isAdmin: false,
                    createdAt: Date.now(),
                    friends: {},
                    postsCount: 0,
                    friendsCount: 0
                });

                await database.ref('notifications/' + userId).set({ notifications: {} });
                window.location.href = 'profile.html';
            } catch (error) {
                errorMsg.textContent = getErrorMessage(error.code);
                errorMsg.classList.remove('hidden');
            } finally {
                loadingOverlay.classList.add('hidden');
                registerBtn.disabled = false;
            }
        });

        function getErrorMessage(code) {
            const messages = {
                'auth/email-already-in-use': 'هذا البريد الإلكتروني مسجل بالفعل',
                'auth/invalid-email': 'البريد الإلكتروني غير صالح',
                'auth/weak-password': 'كلمة المرور ضعيفة'
            };
            return messages[code] || 'حدث خطأ، حاول مرة أخرى';
        }
    </script>
</body>
</html>
