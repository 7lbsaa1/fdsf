<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky7 - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-400 via-sky-500 to-purple-600">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 right-20 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-40 left-10 w-96 h-96 bg-purple-400/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 right-1/4 w-48 h-48 bg-sky-300/20 rounded-full blur-2xl"></div>
    </div>

    <div class="relative min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-3 mb-4">
                    <img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="Sky7" class="w-16 h-16 drop-shadow-lg">
                    <h1 class="text-5xl font-bold text-white drop-shadow-lg">Sky7</h1>
                </div>
                <p class="text-sky-100 text-lg">شارك صور السماء مع العالم</p>
            </div>

            <div class="bg-white/95 backdrop-blur-lg rounded-3xl shadow-2xl p-8">
                <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">تسجيل الدخول</h2>
                
                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">البريد الإلكتروني</label>
                        <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-sky-500 focus:border-transparent outline-none transition-all" placeholder="example@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور</label>
                        <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-sky-500 focus:border-transparent outline-none transition-all" placeholder="••••••••">
                    </div>
                    <div id="errorMsg" class="hidden text-red-500 text-sm text-center"></div>
                    <button type="submit" id="loginBtn" class="w-full py-3 bg-gradient-to-r from-sky-500 to-purple-500 text-white font-semibold rounded-xl hover:from-sky-600 hover:to-purple-600 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">تسجيل الدخول</button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-gray-600">ليس لديك حساب؟</p>
                    <a href="registration.html" class="text-sky-600 hover:text-sky-700 font-semibold hover:underline">إنشاء حساب جديد</a>
                </div>
            </div>

            <div class="text-center mt-6 text-white/70 text-sm">
                <p>© 2024 Sky7 - عالم صور السماء</p>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDFwusZ60ZdCwNfg__YrMA6Ww25jeBOiDk",
            authDomain: "vid1-e2c7d.firebaseapp.com",
            databaseURL: "https://vid1-e2c7d-default-rtdb.firebaseio.com",
            projectId: "vid1-e2c7d",
            storageBucket: "vid1-e2c7d.firebasestorage.app",
            messagingSenderId: "323883326794",
            appId: "1:323883326794:web:e1254b899aefa6584175b3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        auth.onAuthStateChanged((user) => {
            if (user) checkUserStatus(user.uid);
        });

        function checkUserStatus(userId) {
            database.ref('users/' + userId).once('value').then((snapshot) => {
                const userData = snapshot.val();
                if (userData && userData.isBlocked) {
                    auth.signOut();
                    window.location.href = 'block.html';
                } else {
                    window.location.href = 'home.html';
                }
            }).catch(() => { window.location.href = 'home.html'; });
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');

            errorMsg.classList.add('hidden');
            loadingOverlay.classList.remove('hidden');
            loginBtn.disabled = true;

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const userId = userCredential.user.uid;
                const snapshot = await database.ref('users/' + userId).once('value');
                const userData = snapshot.val();

                if (userData && userData.isBlocked) {
                    await auth.signOut();
                    errorMsg.textContent = 'حسابك محظور. تواصل مع الإدارة.';
                    errorMsg.classList.remove('hidden');
                } else {
                    window.location.href = 'home.html';
                }
            } catch (error) {
                errorMsg.textContent = getErrorMessage(error.code);
                errorMsg.classList.remove('hidden');
            } finally {
                loadingOverlay.classList.add('hidden');
                loginBtn.disabled = false;
            }
        });

        function getErrorMessage(code) {
            const messages = {
                'auth/user-not-found': 'البريد الإلكتروني غير مسجل',
                'auth/wrong-password': 'كلمة المرور غير صحيحة',
                'auth/invalid-email': 'البريد الإلكتروني غير صالح',
                'auth/too-many-requests': 'محاولات كثيرة، حاول لاحقاً'
            };
            return messages[code] || 'حدث خطأ، حاول مرة أخرى';
        }
    </script>
</body>
</html>
