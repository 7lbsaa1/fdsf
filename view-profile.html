<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - Sky7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap'); body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="home.html" class="flex items-center gap-2"><img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" class="w-10 h-10"><span class="text-2xl font-bold text-sky-600">Sky7</span></a>
                <div class="flex items-center gap-4">
                    <a href="home.html" class="p-2 hover:bg-gray-100 rounded-full"><svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></a>
                    <a href="profile.html" class="flex items-center gap-2"><img id="navAvatar" src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full object-cover"></a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-6 px-4 pb-8">
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="relative h-48 md:h-64 bg-gradient-to-r from-sky-400 to-purple-500"><img id="coverImage" src="" class="w-full h-full object-cover hidden"></div>
            <div class="relative px-6 pb-6">
                <div class="absolute -top-16 left-1/2 -translate-x-1/2 md:left-6 md:translate-x-0"><img id="avatarImage" src="https://via.placeholder.com/150" class="w-32 h-32 rounded-full border-4 border-white object-cover shadow-lg"></div>
                <div class="mt-20 md:mt-4 md:mr-36">
                    <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                        <div><div class="flex items-center gap-2"><h1 id="displayName" class="text-2xl font-bold text-gray-800">مستخدم</h1><img id="verifiedBadge" src="https://cdn-icons-png.flaticon.com/128/10473/10473969.png" class="w-6 h-6 hidden" title="موثق"></div><p id="userBio" class="text-gray-500 mt-1"></p></div>
                        <button id="actionBtn" class="mt-4 md:mt-0 px-6 py-2 bg-sky-500 text-white rounded-lg hover:bg-sky-600 flex items-center gap-2">إضافة صديق</button>
                    </div>
                    <div class="flex items-center gap-6 mt-6 text-sm text-gray-600"><div class="flex items-center gap-1"><span id="postsCount" class="font-bold text-gray-800">0</span><span>منشورات</span></div><div class="flex items-center gap-1"><span id="friendsCount" class="font-bold text-gray-800">0</span><span>أصدقاء</span></div></div>
                </div>
            </div>
        </div>
        <div class="mt-6"><div class="bg-white rounded-2xl shadow-sm p-4"><h2 class="font-bold text-lg mb-4">المنشورات</h2><div id="userPosts" class="space-y-4"></div></div></div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDFwusZ60ZdCwNfg__YrMA6Ww25jeBOiDk", authDomain: "vid1-e2c7d.firebaseapp.com", databaseURL: "https://vid1-e2c7d-default-rtdb.firebaseio.com", projectId: "vid1-e2c7d", storageBucket: "vid1-e2c7d.firebasestorage.app", messagingSenderId: "323883326794", appId: "1:323883326794:web:e1254b899aefa6584175b3" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        let currentUser = null, profileUserId = null;

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            currentUser = user;
            const urlParams = new URLSearchParams(window.location.search);
            profileUserId = urlParams.get('uid');
            if (!profileUserId) { window.location.href = 'home.html'; return; }
            await loadCurrentUser();
            await loadProfileUser();
        });

        async function loadCurrentUser() {
            const snapshot = await database.ref('users/' + currentUser.uid).once('value');
            const userData = snapshot.val();
            if (userData?.avatar) document.getElementById('navAvatar').src = userData.avatar;
        }

        async function loadProfileUser() {
            const snapshot = await database.ref('users/' + profileUserId).once('value');
            const userData = snapshot.val();
            if (!userData) { alert('المستخدم غير موجود'); window.location.href = 'home.html'; return; }
            document.getElementById('displayName').textContent = userData.username || 'مستخدم';
            document.getElementById('userBio').textContent = userData.bio || '';
            document.getElementById('postsCount').textContent = userData.postsCount || 0;
            document.getElementById('friendsCount').textContent = userData.friendsCount || 0;
            if (userData.avatar) document.getElementById('avatarImage').src = userData.avatar;
            if (userData.coverImage) { document.getElementById('coverImage').src = userData.coverImage; document.getElementById('coverImage').classList.remove('hidden'); }
            if (userData.isVerified) document.getElementById('verifiedBadge').classList.remove('hidden');
            const friendsSnapshot = await database.ref('users/' + currentUser.uid + '/friends/' + profileUserId).once('value');
            const isFriend = friendsSnapshot.exists();
            const actionBtn = document.getElementById('actionBtn');
            if (isFriend) { actionBtn.textContent = 'صديق'; actionBtn.disabled = true; actionBtn.classList.remove('bg-sky-500', 'hover:bg-sky-600'); actionBtn.classList.add('bg-gray-300'); }
            else { actionBtn.onclick = () => addFriend(); }
            await loadUserPosts();
        }

        async function loadUserPosts() {
            const snapshot = await database.ref('posts').orderByChild('userId').equalTo(profileUserId).once('value');
            const posts = [];
            snapshot.forEach((child) => posts.push({ id: child.key, ...child.val() }));
            posts.reverse();
            renderUserPosts(posts);
        }

        function renderUserPosts(posts) {
            const container = document.getElementById('userPosts');
            if (posts.length === 0) { container.innerHTML = '<p class="text-center text-gray-500 py-8">لا توجد منشورات</p>'; return; }
            container.innerHTML = posts.map(post => `<div class="border rounded-xl p-4"><p class="mb-3">${post.caption || ''}</p>${post.imageUrl ? `<img src="${post.imageUrl}" class="w-full rounded-lg max-h-96 object-cover">` : ''}<div class="flex items-center gap-4 mt-3 text-sm text-gray-500"><span>${(post.reactions?.like || 0) + (post.reactions?.love || 0) + (post.reactions?.wow || 0)} إعجاب</span></div></div>`).join('');
        }

        async function addFriend() {
            await database.ref('users/' + profileUserId + '/friends/' + currentUser.uid).set(true);
            await database.ref('users/' + currentUser.uid + '/friends/' + profileUserId).set(true);
            await database.ref('users/' + profileUserId + '/friendsCount').transaction(count => (count || 0) + 1);
            await database.ref('users/' + currentUser.uid + '/friendsCount').transaction(count => (count || 0) + 1);
            const actionBtn = document.getElementById('actionBtn');
            actionBtn.textContent = 'صديق'; actionBtn.disabled = true; actionBtn.classList.remove('bg-sky-500', 'hover:bg-sky-600'); actionBtn.classList.add('bg-gray-300');
            document.getElementById('friendsCount').textContent = parseInt(document.getElementById('friendsCount').textContent) + 1;
        }
    </script>
</body>
</html>
