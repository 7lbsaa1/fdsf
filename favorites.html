<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المفضلة - Sky7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap'); body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="home.html" class="flex items-center gap-2"><img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" class="w-10 h-10"><span class="text-2xl font-bold text-sky-600">Sky7</span></a>
                <div class="flex items-center gap-4">
                    <a href="home.html" class="p-2 hover:bg-gray-100 rounded-full"><svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></a>
                    <a href="profile.html" class="flex items-center gap-2"><img id="navAvatar" src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full object-cover"></a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-6 px-4 pb-8">
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <div class="flex items-center gap-3"><svg class="w-8 h-8 text-sky-500" fill="currentColor" viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg><h1 class="text-2xl font-bold text-gray-800">المفضلة</h1></div>
            <p class="text-gray-500 mt-2">المنشورات المحفوظة</p>
        </div>
        <div id="favoritesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDFwusZ60ZdCwNfg__YrMA6Ww25jeBOiDk", authDomain: "vid1-e2c7d.firebaseapp.com", databaseURL: "https://vid1-e2c7d-default-rtdb.firebaseio.com", projectId: "vid1-e2c7d", storageBucket: "vid1-e2c7d.firebasestorage.app", messagingSenderId: "323883326794", appId: "1:323883326794:web:e1254b899aefa6584175b3" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        let currentUser = null;

        auth.onAuthStateChanged(async (user) => { if (!user) { window.location.href = 'index.html'; return; } currentUser = user; await loadUserData(); await loadSavedPosts(); });

        async function loadUserData() {
            const snapshot = await database.ref('users/' + currentUser.uid).once('value');
            const userData = snapshot.val();
            if (userData?.avatar) document.getElementById('navAvatar').src = userData.avatar;
        }

        async function loadSavedPosts() {
            const savedSnapshot = await database.ref('saved/' + currentUser.uid).once('value');
            const savedIds = savedSnapshot.val() ? Object.keys(savedSnapshot.val()) : [];
            if (savedIds.length === 0) {
                document.getElementById('favoritesGrid').innerHTML = `<div class="col-span-2 text-center py-12 text-gray-500"><svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg><p class="text-lg">لا توجد منشورات محفوظة</p><a href="home.html" class="text-sky-500 hover:underline mt-2 inline-block">استكشف المزيد</a></div>`;
                return;
            }
            let posts = [];
            for (const postId of savedIds) {
                const postSnapshot = await database.ref('posts/' + postId).once('value');
                if (postSnapshot.exists()) posts.push({ id: postId, ...postSnapshot.val() });
            }
            renderSavedPosts(posts);
        }

        function renderSavedPosts(posts) {
            const container = document.getElementById('favoritesGrid');
            container.innerHTML = posts.map(post => `<div class="bg-white rounded-xl shadow-sm overflow-hidden">${post.imageUrl ? `<img src="${post.imageUrl}" class="w-full h-48 object-cover">` : ''}<div class="p-4"><div class="flex items-center gap-3 mb-3"><img src="${post.userAvatar || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full object-cover"><div><div class="flex items-center gap-1"><span class="font-semibold text-sm">${post.username}</span>${post.isVerified ? '<img src="https://cdn-icons-png.flaticon.com/128/10473/10473969.png" class="w-4 h-4">' : ''}</div></div></div><p class="text-sm text-gray-600 line-clamp-2">${post.caption || ''}</p><div class="flex items-center justify-between mt-4"><button onclick="removeFromFavorites('${post.id}')" class="text-red-500 text-sm hover:underline">إزالة</button><button onclick="downloadImage('${post.imageUrl}')" class="text-sky-500 text-sm hover:underline">تحميل</button></div></div></div>`).join('');
        }

        async function removeFromFavorites(postId) { await database.ref('saved/' + currentUser.uid + '/' + postId).remove(); loadSavedPosts(); }
        function downloadImage(url) { if (!url) return; const link = document.createElement('a'); link.href = url; link.download = 'sky7-image.jpg'; link.click(); }
    </script>
</body>
</html>
